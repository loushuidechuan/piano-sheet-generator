[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-sheet-generator"
version = "1.0.0"
description = "分离音乐中的钢琴音轨并自动生成五线谱 PDF（GUI + CLI）"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "WorkBuddy" }]
keywords = ["piano", "transcription", "sheet-music", "source-separation", "music21", "verovio"]

# 核心科学计算依赖（音频分离 CLI 由独立环境提供，见 README「环境搭建」）
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "audioread>=3.0",
    "numba>=0.58",
    "pretty-midi>=0.2.10",
    "piano_transcription_inference==0.0.6",
    "music21>=9.1,<10",
    "verovio>=4.0",
    "svglib>=1.5",
    "reportlab>=4.0",
    "pypdf>=4.0",
    "pymupdf>=1.24",
    "imageio-ffmpeg>=0.4.9",
    "setuptools<81",
]

[project.optional-dependencies]
gui = ["tkinterdnd2>=0.4"]   # 可选: 提供文件拖拽支持

[project.scripts]
piano-sheet = "piano_sheet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
